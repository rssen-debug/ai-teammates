name: CI

on:
  push:
    branches: [main]
    paths: ['studdy-buddy/**']
  pull_request:
    paths: ['studdy-buddy/**']
  workflow_dispatch:

defaults:
  run:
    working-directory: studdy-buddy

jobs:
  verify:
    name: Typecheck, test, build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm
          cache-dependency-path: studdy-buddy/package-lock.json

      - name: Install dependencies
        run: npm ci || npm install
        env:
          # The Electron binary is only needed for packaging, not for verify.
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build renderer
        run: npm run build:ui

      - name: Build electron bundles
        run: node apps/desktop/scripts/build-electron.mjs

      - name: CLI smoke test
        run: npx tsx packages/cli/src/bin.ts doctor --json
        env:
          STUDDY_DATA_DIR: ${{ runner.temp }}/studdy-ci

      - name: Upload build output
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: studdy-buddy-build-${{ matrix.os }}
          path: |
            studdy-buddy/apps/desktop/dist/electron
            studdy-buddy/apps/desktop/dist/renderer
          retention-days: 14

  package:
    name: Windows installer
    needs: verify
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm
          cache-dependency-path: studdy-buddy/package-lock.json

      - name: Install dependencies (with Electron binary)
        run: npm ci || npm install

      - name: Package Windows installer
        run: npm run package:win

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: studdy-buddy-windows-installer
          path: |
            studdy-buddy/apps/desktop/dist/win/*.exe
            studdy-buddy/apps/desktop/dist/win/*.blockmap
          retention-days: 30
          if-no-files-found: error
