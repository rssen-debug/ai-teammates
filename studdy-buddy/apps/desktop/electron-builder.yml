appId: se.studdybuddy.app
productName: Studdy Buddy
# Exact version matches package-lock.json; electron-builder cannot package a range such as ^37.10.3.
electronVersion: 37.10.3
copyright: Copyright © 2026 Studdy Buddy

directories:
  # The app directory is the *staged* dist folder (package.json + electron/ +
  # renderer/), not the repo root. electron-builder resolves `files` and `output`
  # relative to this, so it must be explicit or it looks for main.cjs in the
  # wrong place. Paths are relative to the working directory used by
  # package-win.mjs (apps/desktop).
  app: dist
  output: dist/win
  buildResources: build

# Only the built output ships: no source, no tests, no node_modules tree.
files:
  - electron/**
  - renderer/**
  - package.json

extraMetadata:
  main: electron/main.cjs

win:
  target:
    - target: nsis
      arch:
        - x64
  artifactName: ${productName}-${version}-${arch}.${ext}
  # Windows UI Automation and the SAPI voice bridge are the reason this is
  # x64-only: the native tooling we integrate with is not published for arm64.
  icon: build/buddy.ico
  requestedExecutionLevel: asInvoker

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Studdy Buddy
  deleteAppDataOnUninstall: false
  runAfterFinish: true

# Auto-update is handled by the SHA-256-verified release updater in Electron.
# This packaged icon is the original Buddy pixel monkey, not Electron's default.
publish: null
