appId: se.studdybuddy.app
productName: Studdy Buddy
copyright: Copyright © 2026 Studdy Buddy

directories:
  output: dist/win
  buildResources: build

# Only the built output ships: no source, no tests, no node_modules tree.
files:
  - electron/**
  - renderer/**
  - package.json

extraMetadata:
  main: electron/main.cjs

win:
  target:
    - target: nsis
      arch:
        - x64
  artifactName: ${productName}-${version}-${arch}.${ext}
  # Windows UI Automation and the SAPI voice bridge are the reason this is
  # x64-only: the native tooling we integrate with is not published for arm64.
  requestedExecutionLevel: asInvoker

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Studdy Buddy
  deleteAppDataOnUninstall: false
  runAfterFinish: true

# Auto-update is intentionally NOT configured: it would need a signed feed and
# a pinned update policy. See SECURITY.md.
publish: null
