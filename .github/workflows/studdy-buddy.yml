name: Studdy Buddy CLI CI

on:
  push:
    branches: [main]
    paths: ['studdy-buddy/**', '.github/workflows/studdy-buddy.yml']
  pull_request:
    paths: ['studdy-buddy/**', '.github/workflows/studdy-buddy.yml']
  workflow_dispatch:

defaults:
  run:
    working-directory: studdy-buddy

jobs:
  verify:
    name: Lint, typecheck, test, build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm
          cache-dependency-path: studdy-buddy/package-lock.json
      - name: Install dependencies
        run: npm ci || npm install
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      - name: Built CLI smoke test
        shell: bash
        env:
          STUDDY_DATA_DIR: ${{ runner.temp }}/studdy-ci
        run: |
          set -euo pipefail
          node dist/cli/studdy.mjs --version
          node dist/cli/studdy.mjs help --no-color
          node dist/cli/studdy.mjs setup --no-color
          node dist/cli/studdy.mjs doctor --json --no-color > doctor.json || true
          cat doctor.json
          node -e "
            const r = require('./doctor.json');
            const hard = r.checks.filter(c => !c.ok && !c.blocked && c.name !== 'AI-nyckel');
            if (hard.length) { console.error(hard); process.exit(1); }
          "

      - name: Package CLI tarball
        if: matrix.os == 'windows-latest'
        run: npm run package:cli
        env:
          STUDDY_BUILD_VERSION: 0.2.${{ github.run_number }}

      - name: Upload CLI tarball
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: studdy-buddy-cli
          path: studdy-buddy/dist/*.tgz
          retention-days: 30
          if-no-files-found: error

      - name: Upload browser extension
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: studdy-buddy-browser-extension
          path: studdy-buddy/apps/browser-extension/
          retention-days: 30
          if-no-files-found: error

  windows-native-proof:
    name: Windows CLI native computer-control proof
    needs: verify
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm
          cache-dependency-path: studdy-buddy/package-lock.json
      - run: npm ci || npm install
      - run: npm run build

      - name: Prove native helper, generic launch, window list and snapshot through the real CLI
        shell: pwsh
        env:
          STUDDY_DATA_DIR: ${{ runner.temp }}/studdy-proof
        run: |
          $ErrorActionPreference = 'Stop'
          node dist/cli/studdy.mjs setup --no-color
          node dist/cli/studdy.mjs doctor --json --no-color | Tee-Object -FilePath doctor.json
          $doctor = Get-Content doctor.json -Raw | ConvertFrom-Json
          $native = $doctor.checks | Where-Object name -eq 'Native helper'
          if (-not $native.ok) { throw "Native helper not available: $($native.detail)" }

          node dist/cli/studdy.mjs open "Google Chrome" --json --no-color | Tee-Object -FilePath launch.json
          $launch = Get-Content launch.json -Raw | ConvertFrom-Json
          if (-not $launch.ok) { throw "Chrome launch failed: $($launch.detail)" }
          Start-Sleep -Seconds 3

          node dist/cli/studdy.mjs windows --json --no-color | Tee-Object -FilePath windows.json
          $windows = Get-Content windows.json -Raw | ConvertFrom-Json
          if ($windows.error) { throw $windows.error }
          $chrome = $windows.windows | Where-Object { $_.processName -match 'chrome' } | Select-Object -First 1
          if (-not $chrome) { throw 'No Chrome window observed after verified launch' }

          node dist/cli/studdy.mjs snapshot $chrome.id --json --no-color | Tee-Object -FilePath snapshot.json
          $snapshot = Get-Content snapshot.json -Raw | ConvertFrom-Json
          if (-not $snapshot.accessible) { throw "Snapshot not accessible: $($snapshot.note)" }
          Write-Host "Verified launch + window + $($snapshot.elements.Count) UI elements"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-cli-native-proof
          path: |
            studdy-buddy/doctor.json
            studdy-buddy/launch.json
            studdy-buddy/windows.json
            studdy-buddy/snapshot.json
          retention-days: 14

  release:
    name: Publish CLI tarball to GitHub Release
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [verify, windows-native-proof]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm
          cache-dependency-path: studdy-buddy/package-lock.json
      - run: npm ci || npm install
      - run: npm run package:cli
        env:
          STUDDY_BUILD_VERSION: 0.2.${{ github.run_number }}
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="cli-v0.2.${{ github.run_number }}"
          gh release create "$tag" dist/*.tgz \
            --title "Studdy Buddy CLI 0.2.${{ github.run_number }}" \
            --notes "CLI-only release. Install: npm install -g ./studdy-buddy-*.tgz then run studdy. Requires Node >= 22.13. Native computer control verified on Windows CI. Electron installer archived."
