name: Studdy Buddy CLI CI

on:
  push:
    branches: [main]
    paths: ['studdy-buddy/**', '.github/workflows/studdy-buddy.yml']
  pull_request:
    paths: ['studdy-buddy/**', '.github/workflows/studdy-buddy.yml']
  workflow_dispatch:

defaults:
  run:
    working-directory: studdy-buddy

jobs:
  verify:
    name: Lint, typecheck, test, build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm
          cache-dependency-path: studdy-buddy/package-lock.json
      - name: Install dependencies
        run: npm ci || npm install
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      - name: PowerShell test script parses (Windows PowerShell 5.1)
        if: matrix.os == 'windows-latest'
        shell: powershell
        run: |
          $path = 'scripts/test-on-my-pc.ps1'
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $path), [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Host "PARSE ERROR: $($_.Extent.StartLineNumber): $($_.Message)" }
            exit 1
          }
          Write-Host "Script parses with no errors under $($PSVersionTable.PSVersion)."
          # Den måste också gå att ladda med parametrar och ge rätt tidig avslutning utanför Windows.
          $first = (Get-Content $path -TotalCount 1)
          if ($first -notmatch '^#') { Write-Host 'Saknar inledande kommentar/kommentarshuvud.'; exit 1 }

      - name: Built CLI smoke test
        shell: bash
        env:
          STUDDY_DATA_DIR: ${{ runner.temp }}/studdy-ci
        run: |
          set -euo pipefail
          node dist/cli/studdy.mjs --version
          node dist/cli/studdy.mjs help --no-color
          node dist/cli/studdy.mjs setup --no-color
          node dist/cli/studdy.mjs doctor --json --no-color > doctor.json || true
          cat doctor.json
          node -e "
            const r = require('./doctor.json');
            const hard = r.checks.filter(c => !c.ok && !c.blocked && c.name !== 'AI-nyckel');
            if (hard.length) { console.error(hard); process.exit(1); }
          "

      - name: Linux native capability report (headless is BLOCKED, never fake green)
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        env:
          STUDDY_DATA_DIR: ${{ runner.temp }}/studdy-linux-proof
        run: |
          set -euo pipefail
          node dist/cli/studdy.mjs setup --no-color
          node dist/cli/studdy.mjs windows --json --no-color > linux-windows.json || true
          cat linux-windows.json
          node -e "const r=require('./linux-windows.json'); if (!r.error || !/AT-SPI|D-Bus|desktop/i.test(r.error)) process.exit(1); console.log('Headless desktop blocker observed honestly:', r.error);"

      - name: Package CLI tarball
        if: matrix.os == 'windows-latest'
        run: npm run package:cli
        env:
          STUDDY_BUILD_VERSION: 0.2.${{ github.run_number }}

      - name: Upload CLI tarball
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: studdy-buddy-cli
          path: studdy-buddy/dist/*.tgz
          retention-days: 30
          if-no-files-found: error

      - name: Upload browser extension
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: studdy-buddy-browser-extension
          path: studdy-buddy/apps/browser-extension/
          retention-days: 30
          if-no-files-found: error

  windows-native-proof:
    name: Windows CLI native computer-control proof
    needs: verify
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm
          cache-dependency-path: studdy-buddy/package-lock.json
      - run: npm ci || npm install
      - run: npm run build

      - name: Prove native helper, generic launch, window list and snapshot through the real CLI
        shell: bash
        env:
          STUDDY_DATA_DIR: ${{ runner.temp }}/studdy-proof
        run: |
          set -uo pipefail
          node dist/cli/studdy.mjs setup --no-color
          node dist/cli/studdy.mjs doctor --json --no-color > doctor.json || true
          cat doctor.json
          node -e "
            const r = require('./doctor.json');
            const native = r.checks.find(c => c.name === 'Native helper');
            if (!native?.ok) { console.error('Native helper not available:', native?.detail); process.exit(1); }
          " || { echo "::error title=Native helper::$(node -e "console.log(JSON.stringify(require('./doctor.json')))")"; exit 1; }

          node dist/cli/studdy.mjs open "Notepad" --json --no-color > launch.json || true
          cat launch.json
          node -e "
            const r = require('./launch.json');
            if (!r.ok) { console.error('Notepad launch failed:', r.detail); process.exit(1); }
          " || { echo "::error title=Launch::$(node -e "console.log(JSON.stringify(require('./launch.json')))")"; exit 1; }
          sleep 3

          node dist/cli/studdy.mjs windows --json --no-color > windows.json || true
          cat windows.json
          WINDOW_ID=$(node -e "
            const r = require('./windows.json');
            if (r.error) { console.error(r.error); process.exit(1); }
            const w = r.windows.find(w => /notepad/i.test(w.processName || ''));
            if (!w) { console.error('No Notepad window observed after verified launch'); process.exit(1); }
            console.log(w.id);
          ") || { echo "::error title=Windows::$(node -e "console.log(JSON.stringify(require('./windows.json')))")"; exit 1; }

          node dist/cli/studdy.mjs snapshot "$WINDOW_ID" --json --no-color > snapshot.json || true
          cat snapshot.json
          node -e "
            const r = require('./snapshot.json');
            if (!r.accessible) { console.error('Snapshot not accessible:', r.note); process.exit(1); }
            console.log('Verified launch + window + ' + r.elements.length + ' UI elements');
          " || { echo "::error title=Snapshot::$(node -e "console.log(JSON.stringify(require('./snapshot.json')))")"; exit 1; }

          node dist/cli/studdy.mjs prove --app "Notepad" --json --no-color > prove.json || true
          cat prove.json
          node -e "
            const r = require('./prove.json');
            if (!r.ok) { console.error('Live proof incomplete:', r.steps.filter(s => s.status !== 'pass' && s.status !== 'skipped')); process.exit(1); }
            console.log('Full live proof passed: launch + window + tree + typed text read-back + screenshot');
          " || { echo "::error title=Live proof::$(node -e "console.log(JSON.stringify(require('./prove.json')))")"; exit 1; }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-cli-native-proof
          path: |
            studdy-buddy/doctor.json
            studdy-buddy/launch.json
            studdy-buddy/windows.json
            studdy-buddy/snapshot.json
            studdy-buddy/prove.json
          retention-days: 14

  release:
    name: Publish CLI tarball to GitHub Release
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [verify, windows-native-proof]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm
          cache-dependency-path: studdy-buddy/package-lock.json
      - run: npm ci || npm install
      - run: npm run package:cli
        env:
          STUDDY_BUILD_VERSION: 0.2.${{ github.run_number }}
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="cli-v0.2.${{ github.run_number }}"
          gh release create "$tag" dist/*.tgz \
            --title "Studdy Buddy CLI 0.2.${{ github.run_number }}" \
            --notes "CLI-only release. Install: npm install -g ./studdy-buddy-*.tgz then run studdy. Requires Node >= 22.13. Native computer control verified on Windows CI. Electron installer archived."
